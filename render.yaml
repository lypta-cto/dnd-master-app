# Render blueprint for the app.
#
# A static site, because the app is a client-rendered SPA — there's no server
# to run. The one piece of real configuration is the rewrite: it makes the API
# answer on this site's own origin, which is what keeps the refresh cookie
# first-party. Without it the two services are separate sites, the cookie needs
# SameSite=None, and Safari discards it — a player on an iPhone would be signed
# out every time the access token expired.

services:
  - type: web
    name: dnd-master-app
    runtime: static
    branch: main
    buildCommand: npm ci && npm run generate
    staticPublishPath: .output/public

    envVars:
      # Relative on purpose — see the rewrite below. Both are read at build
      # time: a static site has no server left to read them at runtime, so
      # changing either one needs a fresh deploy, not just a restart.
      - key: NUXT_PUBLIC_API_BASE
        value: /api/v1
      # The API's own origin, for images and the cast stream, which must not go
      # through the rewrite. Set this to the API service's URL.
      - key: NUXT_PUBLIC_API_ORIGIN
        sync: false

    routes:
      # Ordinary API calls, proxied so the browser sees one origin.
      - type: rewrite
        source: /api/*
        # Must match the API service's real URL exactly — Render fills in the
        # hostname from the service name, so renaming the API breaks this.
        destination: https://dnd-master-app-backend.onrender.com/api/*
      # Deep links: the SPA owns its own routing, so anything that isn't a real
      # file is the app. Render skips these rules when a file exists at the
      # path, so assets are unaffected.
      - type: rewrite
        source: /*
        destination: /index.html
